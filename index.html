<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('ClickUp Tasks')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg">

  <meta name="x-icue-restrictions" data-restrictions='[{ "device": "dashboard_lcd" }]'>
  <meta name="x-icue-widget-group" content="tr('Productivity')">

  <!-- MediaViewer for background image support -->
  <script type="text/javascript" src="../common/tools/media_viewer/MediaViewer.js"></script>
  <link rel="stylesheet" type="text/css" href="../common/tools/media_viewer/MediaViewer.css">

  <!-- Feature properties -->
  <meta name="x-icue-property" content="apiToken" data-label="tr('ClickUp API Token')" data-type="textfield" data-default="''">
  <meta name="x-icue-property" content="listId" data-label="tr('List ID (optional, blank = all my tasks)')" data-type="textfield" data-default="''">
  <meta name="x-icue-property" content="widgetTitle" data-label="tr('Title')" data-type="textfield" data-default="'My Tasks'">
  <meta name="x-icue-property" content="dueFilter" data-label="tr('Show')" data-type="combobox" data-default="'all'"
        data-values="[{'key':'all','value':tr('All open tasks')},{'key':'today','value':tr('Due today + overdue')},{'key':'week','value':tr('Due this week')}]">
  <meta name="x-icue-property" content="priorityFilter" data-label="tr('Priority (default)')" data-type="combobox" data-default="'all'"
        data-values="[{'key':'all','value':tr('All priorities')},{'key':'urgent','value':tr('Urgent only')},{'key':'high','value':tr('High & up')},{'key':'normal','value':tr('Normal & up')}]">
  <meta name="x-icue-property" content="statusFilter" data-label="tr('Status (default)')" data-type="combobox" data-default="'all'"
        data-values="[{'key':'all','value':tr('All statuses')},{'key':'open','value':tr('Not started')},{'key':'active','value':tr('In progress')},{'key':'notdone','value':tr('Not done')}]">
  <meta name="x-icue-property" content="maxItems" data-label="tr('Max Tasks')" data-type="slider" data-default="12" data-min="3" data-max="30" data-step="1">
  <meta name="x-icue-property" content="refreshMinutes" data-label="tr('Refresh Interval')" data-type="slider" data-default="5" data-min="1" data-max="30" data-step="1" data-unit-label="'min'">

  <!-- Widget Personalization -->
  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#ffffff'">
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#9f8fff'">
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#15161c'">
  <meta name="x-icue-property" content="backgroundMedia" data-label="tr('Background Image')" data-type="media-selector" data-filters="['*.png','*.jpg','*.jpeg','*.webp']">
  <meta name="x-icue-property" content="glassBlur" data-label="tr('Glass Blur')" data-type="slider" data-default="0" data-min="0" data-max="30" data-step="1">
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'">

  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('ClickUp Tasks')", "properties": ["apiToken", "listId", "widgetTitle", "dueFilter", "priorityFilter", "statusFilter", "maxItems", "refreshMinutes"] },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "backgroundMedia", "glassBlur", "transparency"] }
  ]
  </script>

  <link rel="stylesheet" type="text/css" href="styles/ClickUpTasks.css">
</head>
<body>
  <div class="widget-root">
    <div class="widget-background" aria-hidden="true">
      <div class="main-glass"></div>
      <div id="media-background"></div>
    </div>

    <div class="main-content">
      <div class="loading-state state-panel">
        <div class="spinner"></div>
        <div class="state-text">Loading tasks…</div>
      </div>

      <div class="error-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22L12 2zm0 6c.6 0 1 .4 1 1v5a1 1 0 0 1-2 0V9c0-.6.4-1 1-1zm0 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
        <div class="state-text error-text">Unable to load tasks</div>
        <div class="state-sub error-detail"></div>
      </div>

      <div class="setup-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 .1-1l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.5 7.5 0 0 0-1.7-1L14.6 3a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.8 9a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2L2.9 14.7a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.5c0 .3.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        <div class="state-text">Add your ClickUp API token</div>
        <div class="state-sub">Widget settings &rarr; ClickUp API Token<br>(ClickUp &rarr; Settings &rarr; Apps &rarr; API Token)</div>
      </div>

      <div class="empty-state state-panel" style="display:none;">
        <svg class="state-icon ok" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.4-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7z"/></svg>
        <div class="state-text">All clear</div>
        <div class="state-sub">No matching tasks</div>
      </div>

      <div class="content" style="display:none;">
        <header class="topbar" id="topbar" role="button" tabindex="0" title="Filter tasks">
          <div class="topbar-left">
            <div class="title-row">
              <span class="widget-title">My Tasks</span>
              <svg class="chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
              <span class="filter-dot" id="filterDot" style="display:none;"></span>
            </div>
            <div class="subtitle">ClickUp</div>
          </div>
          <div class="topbar-right">
            <div class="task-count hero-value">0</div>
            <div class="task-count-label">open</div>
          </div>
        </header>
        <div class="filter-bar" id="filterBar" style="display:none;">
          <div class="filter-group">
            <span class="filter-label">Status</span>
            <div class="filter-chips" id="statusChips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">Priority</span>
            <div class="filter-chips" id="priorityChips"></div>
          </div>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="overflow-hint" id="overflowHint" style="display:none;"></div>
      </div>

      <!-- Task details overlay -->
      <div class="detail-view" style="display:none;">
        <header class="detail-header">
          <button class="back-btn" id="backBtn" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
            <span>Back</span>
          </button>
          <span class="detail-list-name" id="detailListName"></span>
        </header>
        <div class="detail-scroll">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-desc" id="detailDesc"></div>
          <div class="detail-section-label">Status</div>
          <div class="detail-statuses" id="detailStatuses">
            <div class="statuses-loading">Loading statuses…</div>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast" style="display:none;">
        <span class="toast-text" id="toastText"></span>
        <button class="toast-action" id="toastAction" type="button" style="display:none;">Undo</button>
      </div>
    </div>
  </div>

  <script>
    icueEvents = {
      'onDataUpdated': onIcueDataUpdated,
      'onICUEInitialized': onIcueInitialized,
      'onUpdateRequested': onUpdateRequested
    };

    let languageCode = 'en';

    function getIcueProperty(name) {
      if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
        const value = window[name];
        if (value !== undefined && value !== null && value !== '') return value;
      }
      try {
        const value = Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
        if (value !== undefined && value !== null && value !== '') return value;
      } catch (e) {}
      return undefined;
    }

    function clampRange(v, min, max, d) {
      v = Number(v);
      if (!Number.isFinite(v)) return d;
      return Math.max(min, Math.min(max, v));
    }

    /* ---------- Media background ---------- */
    const mediaMount = document.getElementById('media-background');

    function createMediaBackgroundComponent(container) {
      if (!container) return { clear: function () {}, loadMedia: function () {} };
      if (typeof MediaViewer === 'function') {
        const viewer = new MediaViewer({
          container: container,
          onMediaLoaded: function () { container.classList.add('has-media'); },
          onMediaError: function (err) {
            container.classList.remove('has-media');
            console.error('Media background error:', err);
          }
        });
        return {
          clear: function () { viewer.clear(); container.classList.remove('has-media'); },
          loadMedia: function (config) { viewer.loadMedia(config); }
        };
      }
      return {
        clear: function () {
          container.style.backgroundImage = '';
          container.classList.remove('has-media');
        },
        loadMedia: function (config) {
          const p = config && (config.path || config.pathToAsset);
          if (!p) { this.clear(); return; }
          container.style.backgroundImage = "url('" + p + "')";
          container.style.backgroundRepeat = 'no-repeat';
          container.style.backgroundPosition = 'center';
          container.style.backgroundSize = 'cover';
          container.classList.add('has-media');
        }
      };
    }
    const mediaBackgroundComponent = createMediaBackgroundComponent(mediaMount);

    function applyStyles() {
      const root = document.documentElement;
      root.style.setProperty('--bg-opacity', clampRange(getIcueProperty('transparency'), 0, 100, 100) / 100);
      const tc = getIcueProperty('textColor');
      const ac = getIcueProperty('accentColor');
      const bgc = getIcueProperty('backgroundColor');
      root.style.setProperty('--text-color', (typeof tc === 'string' && tc) ? tc : '#ffffff');
      root.style.setProperty('--accent-color', (typeof ac === 'string' && ac) ? ac : '#9f8fff');
      root.style.setProperty('--bg-color', (typeof bgc === 'string' && bgc) ? bgc : '#15161c');
      root.style.setProperty('--bg-blur', clampRange(getIcueProperty('glassBlur'), 0, 30, 0) + 'px');

      const bgMedia = getIcueProperty('backgroundMedia');
      if (!bgMedia) { mediaBackgroundComponent.clear(); return; }
      mediaBackgroundComponent.loadMedia({
        path: bgMedia.pathToAsset,
        baseWidth: bgMedia.baseWidth,
        baseHeight: bgMedia.baseHeight,
        scale: typeof bgMedia === 'object' ? bgMedia.scale : undefined,
        positionX: typeof bgMedia === 'object' ? bgMedia.positionX : undefined,
        positionY: typeof bgMedia === 'object' ? bgMedia.positionY : undefined,
        angle: typeof bgMedia === 'object' ? bgMedia.angle : undefined
      });
    }

    let detailOpen = false;

    function showState(state) {
      ['loading-state', 'error-state', 'setup-state', 'empty-state', 'content', 'detail-view'].forEach(s => {
        const el = document.querySelector('.' + s);
        if (el) el.style.display = s === state ? '' : 'none';
      });
      detailOpen = state === 'detail-view';
    }

    /* ---------- ClickUp API ---------- */
    const API = 'https://api.clickup.com/api/v2';
    let cachedIdentity = null;   // { token, userId, teamId, teamName }
    let lastGoodTasks = null;
    let refreshTimer = null;
    let fetchInFlight = false;
    const listStatusCache = new Map();   // listId -> [{status, color, type}]

    /* ---------- Filters (status + priority) ---------- */
    // Fixed priority vocabulary (ClickUp set + a "none" bucket for unprioritized tasks)
    const PRIO_ORDER = ['urgent', 'high', 'normal', 'low', 'none'];
    const PRIO_LABEL = { urgent: 'Urgent', high: 'High', normal: 'Normal', low: 'Low', none: 'None' };
    const PRIO_COLOR = { urgent: '#f50000', high: '#ffcc00', normal: '#6fddff', low: '#b5bcc9', none: '#6b7280' };
    const STATUS_TYPE_RANK = { open: 0, custom: 1, done: 2, closed: 3 };

    // Live selection sets. null = not yet seeded from settings.
    let filterStatus = null;     // Set of selected status names
    let filterPriority = null;   // Set of selected priority keys
    let statusPreset = 'all';    // pending status preset to resolve against loaded statuses
    let filterBarOpen = false;
    // The status set is resolved lazily once we know which statuses exist in the data.
    let statusNeedsResolve = true;

    function prioKey(t) { return t.prio || 'none'; }

    // Seed selections from the iCUE settings dropdowns (defaults / on settings change).
    function seedFiltersFromSettings() {
      const pf = (getIcueProperty('priorityFilter') || 'all').toString();
      let allowed;
      if (pf === 'urgent') allowed = ['urgent'];
      else if (pf === 'high') allowed = ['urgent', 'high'];
      else if (pf === 'normal') allowed = ['urgent', 'high', 'normal'];
      else allowed = PRIO_ORDER.slice();   // 'all'
      filterPriority = new Set(allowed);

      statusPreset = (getIcueProperty('statusFilter') || 'all').toString();
      filterStatus = null;            // resolved against the real statuses at render time
      statusNeedsResolve = true;
    }

    // Build the selected-status set from a preset, given the statuses present in the data.
    function resolveStatusSelection(present) {
      const sel = new Set();
      present.forEach(s => {
        const type = s.type || '';
        let keep;
        if (statusPreset === 'open') keep = type === 'open';
        else if (statusPreset === 'active') keep = type === 'custom';
        else if (statusPreset === 'notdone') keep = (type === 'open' || type === 'custom');
        else keep = true;             // 'all'
        if (keep) sel.add(s.name);
      });
      // A preset that matches nothing (e.g. odd status types) falls back to showing all.
      return sel.size ? sel : new Set(present.map(s => s.name));
    }

    function cuHeaders(token, json) {
      const h = { 'Authorization': token };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    async function cuFetch(token, path, options) {
      const res = await fetch(API + path, Object.assign({ headers: cuHeaders(token, options && options.body) }, options || {}));
      if (!res.ok) {
        const err = new Error('HTTP ' + res.status);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    async function resolveIdentity(token) {
      if (cachedIdentity && cachedIdentity.token === token) return cachedIdentity;
      const [user, teams] = await Promise.all([cuFetch(token, '/user'), cuFetch(token, '/team')]);
      const team = (teams.teams && teams.teams[0]) || null;
      cachedIdentity = {
        token: token,
        userId: user.user && user.user.id,
        teamId: team && team.id,
        teamName: (team && team.name) || 'ClickUp'
      };
      return cachedIdentity;
    }

    async function getListStatuses(listId) {
      if (listStatusCache.has(listId)) return listStatusCache.get(listId);
      const token = getIcueProperty('apiToken');
      const data = await cuFetch(token, '/list/' + encodeURIComponent(listId));
      const statuses = (data.statuses || []).map(s => ({
        status: s.status, color: s.color || '#888888', type: s.type
      }));
      listStatusCache.set(listId, statuses);
      return statuses;
    }

    function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

    function dueInfo(dueMs) {
      if (!dueMs) return null;
      const due = new Date(Number(dueMs));
      const today = startOfDay(new Date());
      const dueDay = startOfDay(due);
      const diffDays = Math.round((dueDay - today) / 86400000);
      if (diffDays < 0) return { cls: 'overdue', label: 'Overdue', sort: -1 + diffDays / 10000 };
      if (diffDays === 0) return { cls: 'today', label: 'Today', sort: 0 };
      if (diffDays === 1) return { cls: 'soon', label: 'Tomorrow', sort: 1 };
      const label = due.toLocaleDateString(languageCode, { month: 'short', day: 'numeric' });
      return { cls: diffDays <= 7 ? 'soon' : 'later', label: label, sort: diffDays };
    }

    async function loadTasks() {
      const token = getIcueProperty('apiToken');
      if (!token) { if (!detailOpen) showState('setup-state'); return; }
      if (fetchInFlight) return;
      fetchInFlight = true;
      try {
        const listIdSetting = (getIcueProperty('listId') || '').toString().trim();
        let tasks = [];
        if (listIdSetting) {
          const data = await cuFetch(token, '/list/' + encodeURIComponent(listIdSetting) +
            '/task?include_closed=false&subtasks=false');
          tasks = data.tasks || [];
          const id = await resolveIdentity(token).catch(() => null);
          if (id) cachedIdentity = id;
        } else {
          const id = await resolveIdentity(token);
          const data = await cuFetch(token, '/team/' + id.teamId +
            '/task?assignees[]=' + id.userId + '&include_closed=false&subtasks=false&order_by=due_date');
          tasks = data.tasks || [];
        }
        lastGoodTasks = tasks;
        renderTasks(tasks, false);
      } catch (e) {
        console.error('ClickUp fetch failed:', e);
        if (lastGoodTasks) {
          renderTasks(lastGoodTasks, true);
        } else if (!detailOpen) {
          showState('error-state');
          document.querySelector('.error-detail').textContent = (e.status === 401)
            ? 'Invalid API token — check widget settings'
            : 'Network error — retrying on next refresh';
        }
      } finally {
        fetchInFlight = false;
      }
    }

    function priorityRank(t) {
      const map = { urgent: 0, high: 1, normal: 2, low: 3 };
      const p = t.priority && t.priority.priority;
      return map[p] !== undefined ? map[p] : 4;
    }

    function shapeTask(t) {
      return {
        id: t.id,
        name: t.name,
        listId: t.list && t.list.id,
        listName: (t.list && t.list.name) || '',
        due: dueInfo(t.due_date),
        dueMs: t.due_date ? Number(t.due_date) : null,
        prio: t.priority && t.priority.priority,
        prioColor: t.priority && t.priority.color,
        prioRank: priorityRank(t),
        status: (t.status && t.status.status) || '',
        statusColor: (t.status && t.status.color) || '#888888',
        statusType: (t.status && t.status.type) || '',
        tags: (t.tags || []).map(x => x.name)
      };
    }

    let lastOffline = false;

    function rerenderFromCache() {
      renderTasks(lastGoodTasks || [], lastOffline);
    }

    function renderTasks(tasks, offline) {
      lastOffline = offline;
      if (filterPriority === null) seedFiltersFromSettings();

      const filter = getIcueProperty('dueFilter') || 'all';
      const max = clampRange(getIcueProperty('maxItems'), 3, 30, 12);

      let shaped = tasks.map(shapeTask);
      if (filter === 'today') shaped = shaped.filter(t => t.due && t.due.sort <= 0);
      if (filter === 'week') shaped = shaped.filter(t => t.due && t.due.sort <= 7);

      // Statuses + priorities actually present in the in-scope tasks (drives the chips).
      const statusMap = new Map();   // name -> {name, color, type}
      shaped.forEach(t => {
        if (t.status && !statusMap.has(t.status)) {
          statusMap.set(t.status, { name: t.status, color: t.statusColor, type: t.statusType });
        }
      });
      const presentStatuses = Array.from(statusMap.values()).sort((a, b) => {
        const ra = STATUS_TYPE_RANK[a.type] !== undefined ? STATUS_TYPE_RANK[a.type] : 9;
        const rb = STATUS_TYPE_RANK[b.type] !== undefined ? STATUS_TYPE_RANK[b.type] : 9;
        return ra !== rb ? ra - rb : a.name.localeCompare(b.name);
      });
      const presentStatusNames = new Set(presentStatuses.map(s => s.name));
      const presentPrios = PRIO_ORDER.filter(k => shaped.some(t => prioKey(t) === k));
      const presentPrioSet = new Set(presentPrios);

      // Resolve the status selection from the settings preset once data is known.
      if (statusNeedsResolve) {
        filterStatus = resolveStatusSelection(presentStatuses);
        statusNeedsResolve = false;
      }

      // A dimension only narrows results when a proper, non-empty subset is selected.
      // (all-selected or none-selected both mean "show everything" for that dimension.)
      const selStatus = new Set([...(filterStatus || [])].filter(n => presentStatusNames.has(n)));
      const selPrio = new Set([...(filterPriority || [])].filter(k => presentPrioSet.has(k)));
      const statusConstrained = selStatus.size > 0 && selStatus.size < presentStatusNames.size;
      const prioConstrained = selPrio.size > 0 && selPrio.size < presentPrioSet.size;
      const anyConstrained = statusConstrained || prioConstrained;

      let filtered = shaped.filter(t => {
        if (statusConstrained && !selStatus.has(t.status)) return false;
        if (prioConstrained && !selPrio.has(prioKey(t))) return false;
        return true;
      });

      filtered.sort((a, b) => {
        const as = a.due ? a.due.sort : 9999;
        const bs = b.due ? b.due.sort : 9999;
        if (as !== bs) return as - bs;
        return a.prioRank - b.prioRank;
      });

      const scopedTotal = shaped.length;
      const total = filtered.length;
      const visible = filtered.slice(0, max);

      document.querySelector('.widget-title').textContent = getIcueProperty('widgetTitle') || 'My Tasks';
      document.querySelector('.subtitle').textContent =
        (cachedIdentity ? cachedIdentity.teamName : 'ClickUp') +
        (anyConstrained ? ' • filtered' : '') + (offline ? ' • offline' : '');
      document.querySelector('.task-count').textContent = total;
      document.querySelector('.task-count-label').textContent = total === 1 ? 'task' : 'tasks';

      // Build the filter-bar chips + the topbar "filters active" indicator.
      renderFilterChips(presentStatuses, presentPrios, selStatus, selPrio);
      const dot = document.getElementById('filterDot');
      const chev = document.querySelector('.chevron');
      if (dot) dot.style.display = anyConstrained ? '' : 'none';
      if (chev) chev.classList.toggle('active', anyConstrained);

      // No tasks at all in scope → the friendly "all clear" panel.
      if (scopedTotal === 0) { if (!detailOpen) showState('empty-state'); return; }

      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      // Tasks exist but the active filters hide them all → keep the bar reachable.
      if (total === 0) {
        const note = document.createElement('div');
        note.className = 'filter-empty';
        note.textContent = 'No tasks match the current filters';
        listEl.appendChild(note);
        document.getElementById('overflowHint').style.display = 'none';
        if (!filterBarOpen) setFilterBar(true);
        if (!detailOpen) showState('content');
        return;
      }

      visible.forEach(t => {
        const row = document.createElement('div');
        row.className = 'task-row';
        row.dataset.taskId = t.id;

        const circle = document.createElement('span');
        circle.className = 'check-circle';
        circle.title = 'Mark complete';

        const main = document.createElement('div');
        main.className = 'task-main';
        const name = document.createElement('div');
        name.className = 'task-name';
        name.textContent = t.name;
        const meta = document.createElement('div');
        meta.className = 'task-meta';
        if (t.listName) {
          const ln = document.createElement('span');
          ln.className = 'task-list-name';
          ln.textContent = t.listName;
          meta.appendChild(ln);
        }
        if (t.due) {
          const chip = document.createElement('span');
          chip.className = 'due-chip due-' + t.due.cls;
          chip.textContent = t.due.label;
          meta.appendChild(chip);
        }
        main.appendChild(name);
        main.appendChild(meta);

        const star = document.createElement('span');
        star.className = 'prio-star' + ((t.prio === 'urgent' || t.prio === 'high') ? ' prio-on' : '');
        star.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 20.6l1.5-6.5-5-4.4 6.6-.6L12 3l2.7 6.1 6.6.6-5 4.4 1.5 6.5z"/></svg>';

        row.appendChild(circle);
        row.appendChild(main);
        row.appendChild(star);

        // Interactions: circle = quick complete, anywhere else = details
        circle.addEventListener('click', function (e) {
          e.stopPropagation();
          quickComplete(t, row);
        });
        row.addEventListener('click', function () { openDetails(t); });

        listEl.appendChild(row);
      });

      const hint = document.getElementById('overflowHint');
      if (total > visible.length) {
        hint.textContent = '+' + (total - visible.length) + ' more';
        hint.style.display = '';
      } else {
        hint.style.display = 'none';
      }

      if (!detailOpen) showState('content');
    }

    /* ---------- Filter bar UI ---------- */
    function makeChip(label, color, on, onToggle) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'filter-chip' + (on ? ' on' : '');
      chip.style.setProperty('--chip-color', color);
      const dot = document.createElement('span');
      dot.className = 'chip-dot';
      const txt = document.createElement('span');
      txt.textContent = label;
      chip.appendChild(dot);
      chip.appendChild(txt);
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        onToggle();
      });
      return chip;
    }

    function renderFilterChips(presentStatuses, presentPrios, selStatus, selPrio) {
      const sWrap = document.getElementById('statusChips');
      const pWrap = document.getElementById('priorityChips');
      if (!sWrap || !pWrap) return;

      // Each chip is an independent toggle; "on" simply mirrors its selection-set
      // membership. (All-on and all-off both mean "show everything" — see renderTasks.)
      sWrap.innerHTML = '';
      presentStatuses.forEach(s => {
        sWrap.appendChild(makeChip(s.name, s.color || '#888888', selStatus.has(s.name), function () {
          toggleSelection(filterStatus, s.name);
          rerenderFromCache();
        }));
      });
      if (!presentStatuses.length) sWrap.innerHTML = '<span class="filter-none">No statuses</span>';

      pWrap.innerHTML = '';
      presentPrios.forEach(k => {
        pWrap.appendChild(makeChip(PRIO_LABEL[k], PRIO_COLOR[k], selPrio.has(k), function () {
          toggleSelection(filterPriority, k);
          rerenderFromCache();
        }));
      });
      if (!presentPrios.length) pWrap.innerHTML = '<span class="filter-none">No priorities</span>';
    }

    // Independent multi-select toggle. The filter only narrows results when a
    // proper, non-empty subset of the present values is selected (see renderTasks);
    // an empty selection or a full selection both mean "show everything".
    function toggleSelection(set, value) {
      if (!set) return;
      if (set.has(value)) set.delete(value);
      else set.add(value);
    }

    function setFilterBar(open) {
      filterBarOpen = open;
      const bar = document.getElementById('filterBar');
      const chev = document.querySelector('.chevron');
      if (bar) bar.style.display = open ? '' : 'none';
      if (chev) chev.classList.toggle('open', open);
    }
    function toggleFilterBar() { setFilterBar(!filterBarOpen); }

    (function wireTopbar() {
      const tb = document.getElementById('topbar');
      if (!tb) return;
      tb.addEventListener('click', toggleFilterBar);
      tb.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFilterBar(); }
      });
    })();

    /* ---------- Toast ---------- */
    let toastTimer = null;
    function showToast(text, actionLabel, onAction, ms) {
      const toast = document.getElementById('toast');
      const txt = document.getElementById('toastText');
      const btn = document.getElementById('toastAction');
      txt.textContent = text;
      if (actionLabel && onAction) {
        btn.textContent = actionLabel;
        btn.style.display = '';
        btn.onclick = function () { hideToast(); onAction(); };
      } else {
        btn.style.display = 'none';
        btn.onclick = null;
      }
      toast.style.display = '';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, ms || 3000);
    }
    function hideToast() {
      document.getElementById('toast').style.display = 'none';
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    }

    /* ---------- Status changes ---------- */
    async function setTaskStatus(taskId, statusName) {
      const token = getIcueProperty('apiToken');
      return cuFetch(token, '/task/' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: JSON.stringify({ status: statusName })
      });
    }

    function findClosedStatus(statuses) {
      return statuses.find(s => s.type === 'closed') ||
             statuses.find(s => s.type === 'done') ||
             statuses.find(s => /^(complete|done|closed)$/i.test(s.status)) || null;
    }

    function quickComplete(task, row) {
      if (row.classList.contains('completing')) return; // already pending
      row.classList.add('completing');
      let cancelled = false;

      showToast('Completing "' + task.name.slice(0, 40) + (task.name.length > 40 ? '…' : '') + '"', 'Undo', function () {
        cancelled = true;
        row.classList.remove('completing');
      }, 3000);

      setTimeout(async function () {
        if (cancelled) return;
        try {
          const statuses = await getListStatuses(task.listId);
          const closed = findClosedStatus(statuses);
          if (!closed) throw new Error('No closed status on list');
          await setTaskStatus(task.id, closed.status);
          row.classList.add('completed-gone');
          setTimeout(loadTasks, 450);
        } catch (e) {
          console.error('Complete failed:', e);
          row.classList.remove('completing');
          showToast('Could not complete task — try again', null, null, 4000);
        }
      }, 3000);
    }

    /* ---------- Details view ---------- */
    let detailTask = null;

    function fmtFullDue(ms) {
      if (!ms) return null;
      return new Date(ms).toLocaleDateString(languageCode, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    async function openDetails(task) {
      detailTask = task;
      document.getElementById('detailListName').textContent = task.listName || '';
      document.getElementById('detailTitle').textContent = task.name;

      const meta = document.getElementById('detailMeta');
      meta.innerHTML = '';
      if (task.due) {
        const chip = document.createElement('span');
        chip.className = 'due-chip due-' + task.due.cls;
        chip.textContent = task.due.label + (task.dueMs && task.due.cls !== 'overdue' && task.due.cls !== 'today'
          ? '' : (task.dueMs ? ' • ' + fmtFullDue(task.dueMs) : ''));
        meta.appendChild(chip);
      }
      if (task.prio) {
        const p = document.createElement('span');
        p.className = 'prio-badge';
        p.textContent = task.prio.toUpperCase();
        if (task.prioColor) p.style.color = task.prioColor;
        meta.appendChild(p);
      }
      task.tags.forEach(tag => {
        const tg = document.createElement('span');
        tg.className = 'tag-badge';
        tg.textContent = tag;
        meta.appendChild(tg);
      });

      document.getElementById('detailDesc').textContent = '';
      const stWrap = document.getElementById('detailStatuses');
      stWrap.innerHTML = '<div class="statuses-loading">Loading statuses…</div>';
      showState('detail-view');

      const token = getIcueProperty('apiToken');

      // Description (best-effort) + statuses in parallel
      cuFetch(token, '/task/' + encodeURIComponent(task.id)).then(full => {
        const desc = (full.text_content || full.description || '').trim();
        document.getElementById('detailDesc').textContent = desc ? desc.slice(0, 600) : '';
      }).catch(() => {});

      try {
        const statuses = await getListStatuses(task.listId);
        renderStatusButtons(statuses, task);
      } catch (e) {
        stWrap.innerHTML = '<div class="statuses-loading">Could not load statuses</div>';
      }
    }

    function renderStatusButtons(statuses, task) {
      const wrap = document.getElementById('detailStatuses');
      wrap.innerHTML = '';
      statuses.forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'status-pill' + (s.status.toLowerCase() === task.status.toLowerCase() ? ' current' : '');
        btn.style.setProperty('--pill-color', s.color);
        const dot = document.createElement('span');
        dot.className = 'pill-dot';
        const label = document.createElement('span');
        label.textContent = s.status.toUpperCase();
        btn.appendChild(dot);
        btn.appendChild(label);
        btn.addEventListener('click', async function () {
          if (btn.classList.contains('current') || wrap.classList.contains('busy')) return;
          wrap.classList.add('busy');
          btn.classList.add('saving');
          try {
            await setTaskStatus(task.id, s.status);
            task.status = s.status;
            wrap.querySelectorAll('.status-pill').forEach(b => b.classList.remove('current'));
            btn.classList.add('current');
            showToast('Status → ' + s.status.toUpperCase(), null, null, 2200);
            loadTasks();
          } catch (e) {
            console.error('Status change failed:', e);
            showToast('Could not change status — try again', null, null, 4000);
          } finally {
            btn.classList.remove('saving');
            wrap.classList.remove('busy');
          }
        });
        wrap.appendChild(btn);
      });
    }

    document.getElementById('backBtn').addEventListener('click', function () {
      detailTask = null;
      showState('content');
      loadTasks();
    });

    /* ---------- Lifecycle ---------- */
    function scheduleRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      const mins = clampRange(getIcueProperty('refreshMinutes'), 1, 30, 5);
      refreshTimer = setInterval(loadTasks, mins * 60000);
    }

    function onUpdateRequested() { loadTasks(); }

    function onIcueDataUpdated() {
      applyStyles();
      scheduleRefresh();
      seedFiltersFromSettings();   // settings changed → reset live filters to new defaults
      loadTasks();
    }

    function onIcueInitialized() {
      if (typeof iCUE !== 'undefined' && iCUE.iCUELanguage) languageCode = iCUE.iCUELanguage;
      onIcueDataUpdated();
    }

    if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
      onIcueInitialized();
    } else {
      onIcueDataUpdated();
    }
  </script>
</body>
